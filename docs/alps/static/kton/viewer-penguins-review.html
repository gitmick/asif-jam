<!doctype html><meta charset="utf-8"><title>kton · graph viewer</title>
<script>
// penguins (layout fluss-baum as the trains get it from their based-on tree: left to right, orthogonal)
// penguins with the review: as viewer-penguins.html, and files only one step reads folded into that step (the review check reads 11 key and record files)
// hand the lens's parameters on into kw/: every ?union= (one per registry), made absolute; the
// talk view (descriptions as labels, statements folded into their steps) unless one is named
var q = new URLSearchParams(location.search), out = new URLSearchParams();
q.forEach(function (v, k) {
  out.append(k, ["union", "keys", "names", "graph", "select"].indexOf(k) >= 0 ? new URL(v, location.href).href : v); });
if (!out.has("panel") && !out.has("preview")) out.set("panel", "closed");
if (!out.has("view")) out.set("view", JSON.stringify({ preset: "pmx", node: { font: 14, wrap: 22 }, graph: { hide: ["claim", "ref", "entity", "source:code", "source:single-use"], notes: "rationale", outputs: "endpoints", layout: "fluss-baum" } }));
location.replace("kw/viewers/graph/index.html?" + out.toString() + location.hash);
</script>
